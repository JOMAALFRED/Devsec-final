server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/tls.key;
    root /usr/share/nginx/html;
    index index.html;
}
